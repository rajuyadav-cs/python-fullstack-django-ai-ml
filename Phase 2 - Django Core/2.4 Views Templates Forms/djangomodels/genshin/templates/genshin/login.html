{% extends "genshin/index.html" %}

{% block content %}

<form action = "{% url "login" %}" method="POST">

    {% csrf_token %}

    <label>Username</label>

    {{ form.username }}

    <br><br>

    <label>Password</label>

    {{ form.password }}

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

{% endblock content %}
