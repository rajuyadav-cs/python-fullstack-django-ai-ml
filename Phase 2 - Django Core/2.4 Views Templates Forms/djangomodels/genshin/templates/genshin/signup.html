{% extends "genshin/index.html" %}

{% block content %}
<h1>Signup page</h1>
<div class="signupform">
    <form action="{% url "signup" %}" method = "POST" >
        {% csrf_token %}
        <label>Username</label>
        {{form.username}}

        <label>Password</label>
        {{form.password1}}
        <label>Confirm Password</label>
        {{form.password2}}

        <br><br>

        <button type = 'submit'>SignUp</button>

    </form>
</div>
{% endblock content %}
