<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        HOMEPAGE
        {% endblock title %}
    </title>
</head>
<body>

    {% block content %}

    <h1>HOMEPAGE</h1>

    {% if user.is_authenticated %}

        <h3>Welcome {{ user.username }}</h3>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">
                Logout
            </button>
        </form>

    {% else %}

        <h3>Guest User</h3>

    {% endif %}

    {% endblock content %}

    <hr>

    <div class="footer">

        {% if not user.is_authenticated %}

            <a href="{% url 'signup' %}">
                Signup
            </a>

            <br><br>

            <a href="{% url 'login' %}">
                Login
            </a>

            <br><br>

        {% endif %}

        <a href="{% url 'home' %}">
            Home
        </a>

        <br><br>

        <a href="{% url 'admin:index' %}">
            Admin Panel
        </a>

    </div>

</body>
</html>
